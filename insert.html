<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Insert Records</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Header -->

    <header class="header">

        <a href="index.html" class="back-button">
            ← Home
        </a>

        <div class="header-title">
            INSERT RECORD
        </div>

    </header>



    <!-- Main -->

    <main class="insert-page">

        <h1>
            Insert New Record
        </h1>

        <p>
            Select the type of information you want to add.
        </p>



        <div class="insert-container">


            <!-- Beneficiary -->

            <a href="beneficiary.html"
               class="insert-card">

                <div class="card-icon">
                    👤
                </div>

                <h2>
                    Beneficiary
                </h2>

                <p>
                    Register a person who receives
                    relief assistance.
                </p>

            </a>



            <!-- Organization -->

            <a href="organization.html"
               class="insert-card">

                <div class="card-icon">
                    🏢
                </div>

                <h2>
                    Organization
                </h2>

                <p>
                    Register an NGO, government or
                    other organization.
                </p>

            </a>



            <!-- Relief Program -->

            <a href="relief-program.html"
               class="insert-card">

                <div class="card-icon">
                    📋
                </div>

                <h2>
                    Relief Program
                </h2>

                <p>
                    Create and register a
                    relief distribution program.
                </p>

            </a>


        </div>

    </main>


</body>

</html>
